[project]
name = "budgetbakers-import"
version = "1.1.0"
description = "Convert bank Excel statements to BudgetBakers CSV / Wallet API import"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.9",
    "mypy==2.3.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
