[project]
name = "budgetbakers-import"
version = "1.0.0"
description = "Convert bank Excel statements to BudgetBakers CSV / Wallet API import"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.8",
    "uvicorn[standard]==0.34.0",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
    "pydantic-settings==2.7.1",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "ruff==0.9.6",
    "mypy==1.14.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
