<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BudgetBakers Import{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">
      <span class="brand-mark">BB</span>
      <span class="brand-text">BudgetBakers Import</span>
    </a>
    <div class="top-end">
      <nav>
        <a href="/" class="{% if active_nav == 'convert' %}nav-active{% endif %}">{{ t("nav.convert") }}</a>
        <a href="/settings/accounts" class="{% if active_nav == 'accounts' %}nav-active{% endif %}">{{ t("nav.accounts") }}</a>
        <a href="/settings/categories" class="{% if active_nav == 'categories' %}nav-active{% endif %}">{{ t("nav.categories") }}</a>
      </nav>
      <div class="lang-switch" role="navigation" aria-label="{{ t('lang.switcher') }}">
        <a href="/lang/uk" class="{% if lang == 'uk' %}lang-active{% endif %}" hreflang="uk" lang="uk">UK</a>
        <span class="lang-sep" aria-hidden="true">|</span>
        <a href="/lang/en" class="{% if lang == 'en' %}lang-active{% endif %}" hreflang="en" lang="en">EN</a>
      </div>
    </div>
  </header>
  <main class="wrap">
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    {% if success %}
    <div class="alert alert-ok">{{ success }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    <span>{{ t("footer.stage") }}</span>
  </footer>
</body>
</html>
