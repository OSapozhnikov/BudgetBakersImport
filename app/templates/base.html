<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BudgetBakers Import{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">
      <span class="brand-mark">BB</span>
      <span class="brand-text">BudgetBakers Import</span>
    </a>
    <nav>
      <a href="/" class="{% if active_nav == 'convert' %}nav-active{% endif %}">Конвертація</a>
      <a href="/settings/accounts" class="{% if active_nav == 'accounts' %}nav-active{% endif %}">Рахунки</a>
      <a href="/settings/categories" class="{% if active_nav == 'categories' %}nav-active{% endif %}">Категорії</a>
    </nav>
  </header>
  <main class="wrap">
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    {% if success %}
    <div class="alert alert-ok">{{ success }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    <span>Етап 2: Excel → CSV або імпорт у BudgetBakers через API.</span>
  </footer>
</body>
</html>
